services:
  - type: web
    name: stare-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        value: https://bprknqcgtezsgfjuztqs.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_7DuSM4ZLMMX9rLnBva0LfA_yDRi4eE7
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: vittok/stare
      - key: GITHUB_WORKFLOW
        value: pipeline_weekdays.yml
      - key: REFRESH_ALLOWED_EMAILS
        value: vittok@gmail.com

  - type: web
    name: stare-portal
    runtime: node
    rootDir: apps/web
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://bprknqcgtezsgfjuztqs.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_7DuSM4ZLMMX9rLnBva0LfA_yDRi4eE7
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: FASTAPI_URL
        sync: false

  # Each paired UTC schedule fires twice. The command keeps only the occurrence
  # that maps to the requested America/New_York market time across DST changes.
  - type: cron
    name: stare-market-open
    runtime: python
    plan: 0.5c-512mb
    schedule: "35 13,14 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python src/run_render_scheduled_update.py --window market-open
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STARE_APP_URL
        value: https://stare-portal.onrender.com
      - key: STARE_EMAIL_TO
        value: vittok@hotmail.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ae97a1001@smtp-brevo.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: ae97a1001@smtp-brevo.com
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_SSL
        value: "false"

  - type: cron
    name: stare-market-close
    runtime: python
    plan: 0.5c-512mb
    schedule: "10 20,21 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python src/run_render_scheduled_update.py --window market-close
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STARE_APP_URL
        value: https://stare-portal.onrender.com
      - key: STARE_EMAIL_TO
        value: vittok@hotmail.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ae97a1001@smtp-brevo.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: ae97a1001@smtp-brevo.com
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
