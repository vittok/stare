name: STARE Market Refresh

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC/GMT. Paired schedules cover US daylight saving shifts.
    # The guard step below only allows the run that maps to New York market time.
    # Market open refresh: 09:35 America/New_York
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"
    # Market close refresh: 16:10 America/New_York
    - cron: "10 20 * * 1-5"
    - cron: "10 21 * * 1-5"
    # Early close refresh (13:10 New York); calendar guard rejects normal days.
    - cron: "10 17 * * 1-5"
    - cron: "10 18 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stare-daily-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main before calculation
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check market refresh window
        id: market-window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python src/github_market_schedule.py

      - name: Validate update secrets
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          for key in DATABASE_URL SMTP_USERNAME SMTP_PASSWORD SMTP_FROM; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing Actions secret: $key"
              exit 1
            fi
          done

      - name: Preserve previous report for email comparison
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        run: |
          if [ -f stare_app.html ]; then
            cp stare_app.html "$RUNNER_TEMP/stare-previous.html"
          fi

      - name: Calculate and publish market update
        id: calculation
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          STARE_POSTGRES_MODE: required
          STARE_REFRESH_LABEL: ${{ steps.market-window.outputs.label }}
          WITH_FUNDAMENTALS: ${{ steps.market-window.outputs.with_fundamentals }}
        run: |
          if [ "$WITH_FUNDAMENTALS" = "true" ]; then
            python src/run_pipeline.py --with-fundamentals
          else
            python src/run_pipeline.py
          fi

      - name: Commit & push updated data/reports/site
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure this scheduled run is based on the latest main before committing.
          git pull --ff-only origin main

          # Stage the artifacts you want committed
          git add data/stocks.db data/universe_sp500.csv data/universe_global.csv reports/ docs/ stare_app.html || true

          # If nothing changed, don't fail
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated STARE daily update"
          git push

      - name: Configure GitHub Pages
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published portal and Pages data
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        env:
          EXPECTED_UPDATE_ID: ${{ steps.calculation.outputs.update_run_id }}
          STARE_API_URL: https://stare-api.onrender.com
          STARE_PORTAL_URL: https://stare-portal.onrender.com
          STARE_PAGES_URL: https://vittok.github.io/stare
        run: python src/verify_published_update.py

      - name: Send app update email
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_AUTH: "true"
          SMTP_STARTTLS: "true"
          SMTP_SSL: "false"
          STARE_APP_URL: https://stare-portal.onrender.com
          STARE_REFRESH_LABEL: ${{ steps.market-window.outputs.label }}
          STARE_UPDATE_STATUS: success
          STARE_PREVIOUS_APP_HTML: ${{ runner.temp }}/stare-previous.html
        run: python src/email_stare_report.py

      - name: Send update failure alert
        if: ${{ failure() && steps.market-window.outputs.should_run == 'true' }}
        env:
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          STARE_ALERT_TO: ${{ secrets.STARE_ALERT_TO }}
          STARE_APP_URL: https://stare-portal.onrender.com
          STARE_ALERT_DETAILS: "GitHub Actions run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python src/update_alerts.py failure
