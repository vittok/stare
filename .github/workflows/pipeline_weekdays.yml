name: Daily STARE Publish

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC/GMT. This runs every morning at 07:00 GMT.
    - cron: "0 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stare-daily-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline and publish app
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python src/run_pipeline.py

      # Optional: run fundamentals once a week (Monday) to reduce load
      - name: Run fundamentals (Mondays only)
        if: ${{ github.event_name == 'schedule' && startsWith(github.event.schedule, '0 7') }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python src/fetch_fundamentals.py
            python src/build_sector_dashboard.py
            python src/build_sector_dashboard_html.py
            python src/publish_stare_app.py
          else
            echo "Skipping fundamentals (not Monday)."
          fi

      - name: Commit & push updated data/reports/site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the artifacts you want committed
          git add data/stocks.db data/universe_sp500.csv reports/ docs/ stare_app.html || true

          # If nothing changed, don't fail
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated STARE daily update"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
