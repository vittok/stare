name: STARE Market Refresh

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC/GMT. Paired schedules cover US daylight saving shifts.
    # The guard step below only allows the run that maps to New York market time.
    # Market open refresh: 09:35 America/New_York
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"
    # Market close refresh: 16:10 America/New_York
    - cron: "10 20 * * 1-5"
    - cron: "10 21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stare-daily-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check market refresh window
        id: market-window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          now = datetime.now(ZoneInfo("America/New_York"))

          if event_name == "workflow_dispatch":
              should_run = True
              label = "manual"
          else:
              is_weekday = now.weekday() < 5
              is_market_open_refresh = now.hour == 9 and 30 <= now.minute <= 59
              is_market_close_refresh = now.hour == 16 and 5 <= now.minute <= 45
              should_run = is_weekday and (is_market_open_refresh or is_market_close_refresh)
              label = "market-open" if is_market_open_refresh else "market-close" if is_market_close_refresh else "outside-window"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={str(should_run).lower()}\n")
              f.write(f"label={label}\n")
              f.write(f"ny_time={now.isoformat(timespec='seconds')}\n")

          print(f"New York time: {now.isoformat(timespec='seconds')}")
          print(f"Refresh label: {label}")
          print(f"Should run: {should_run}")
          PY

      - name: Checkout
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main before calculation
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        run: |
          git pull --ff-only origin main

      - name: Set up Python
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline and publish app
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          STARE_REFRESH_LABEL: ${{ steps.market-window.outputs.label }}
        run: |
          python src/run_pipeline.py

      # Optional: run fundamentals once a week after Monday market close to reduce load
      - name: Run fundamentals (Monday close only)
        if: ${{ github.event_name == 'schedule' && steps.market-window.outputs.should_run == 'true' }}
        run: |
          if python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          raise SystemExit(0 if now.weekday() == 0 and now.hour == 16 else 1)
          PY
          then
            python src/fetch_fundamentals.py
            python src/build_sector_dashboard.py
            python src/build_sector_dashboard_html.py
            python src/publish_stare_app.py
          else
            echo "Skipping fundamentals (not Monday market close)."
          fi

      - name: Commit & push updated data/reports/site
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure this scheduled run is based on the latest main before committing.
          git pull --ff-only origin main

          # Stage the artifacts you want committed
          git add data/stocks.db data/universe_sp500.csv reports/ docs/ stare_app.html || true

          # If nothing changed, don't fail
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated STARE daily update"
          git push

      - name: Configure GitHub Pages
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: ${{ steps.market-window.outputs.should_run == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send scheduled email report
        if: ${{ github.event_name == 'schedule' && steps.market-window.outputs.should_run == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          STARE_EMAIL_TO: vittok@hotmail.com
          STARE_APP_URL: https://vittok.github.io/stare/
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::Skipping email report because SMTP_HOST, SMTP_USERNAME, or SMTP_PASSWORD is not configured as a repository secret."
            exit 0
          fi

          python src/email_stare_report.py
