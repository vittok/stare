name: STARE Data Freshness

on:
  workflow_dispatch:
  schedule:
    # Runs after every normal US market close; the calendar-aware checker
    # automatically uses the preceding session on weekends and holidays.
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install alert dependencies
        run: pip install "psycopg[binary]>=3.2" "pandas-market-calendars==5.1.3"

      - name: Check latest successful update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          STARE_ALERT_TO: ${{ secrets.STARE_ALERT_TO }}
          STARE_APP_URL: https://stare-portal.onrender.com
        run: python src/update_alerts.py stale
